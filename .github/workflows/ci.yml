name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The upload path writes a NamedTemporaryFile and removes it in a
        # finally block; Windows file locking makes that meaningfully
        # different from POSIX, and Windows is the primary dev platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify installed versions match the pins
        shell: bash
        run: python .github/scripts/check_pins.py

      - name: Run tests
        run: python -m pytest backend -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # vite, @vitejs/plugin-react and oxlint all declare
          # engines: ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
